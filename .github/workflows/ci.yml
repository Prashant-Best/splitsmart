name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    name: Server (lint, types, tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    env:
      # Keep the MongoDB binary used by the in-memory replica set outside node_modules so it caches.
      MONGOMS_DOWNLOAD_DIR: ${{ github.workspace }}/.cache/mongodb-binaries
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: server/package-lock.json
      - uses: actions/cache@v4
        with:
          path: .cache/mongodb-binaries
          key: mongodb-binaries-8.2.6-${{ runner.os }}
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run format:check
      - name: Test (unit + integration on an in-memory replica set)
        run: npm run test:coverage
      - run: npm run build

  client:
    name: Client (lint, tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - name: Type-check and build (includes the shared domain module)
        run: npm run build

  docker:
    name: Docker (build images, run the stack, smoke test)
    needs: [server, client]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build images
        run: docker compose build
      - name: Start MongoDB, API, web app and Mailpit
        run: docker compose up -d --wait --wait-timeout 180
      - name: Smoke test through nginx
        run: bash scripts/smoke-test.sh http://localhost:8080
      - name: Seed demo data and sign in as the demo user
        run: |
          docker compose --profile tools run --rm seed
          curl -fsS -H 'Content-Type: application/json' \
            -d '{"email":"prashant@example.com","password":"splitsmart-demo"}' \
            http://localhost:8080/api/auth/login | jq -e '.user.name == "Prashant Panwar"'
      - name: Show logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Stop
        if: always()
        run: docker compose down -v
